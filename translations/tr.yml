    Bu araç her bant yolunu titreştirir ve rezonans frekansını ölçer; eşleşen frekanslar dengeli gerilim anlamına gelir.


    CoreXY için Yol A ve B birbirinden birkaç Hz uzaklıkta olmalıdır.'
