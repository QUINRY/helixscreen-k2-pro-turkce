name: Build K2 Turkish artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-k2:
    name: Cross-compile Creality K2
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Initialize submodules
        uses: ./.github/actions/init-submodules

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure ccache
        run: |
          mkdir -p /tmp/.ccache-k2
          printf 'max_size = 2G\ncompression = true\n' > /tmp/.ccache-k2/ccache.conf

      - name: Build K2 toolchain image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=toolchain-k2 \
            --cache-to type=gha,mode=max,scope=toolchain-k2 \
            --load \
            -t helixscreen/toolchain-k2 \
            -f docker/Dockerfile.k2 \
            docker/

      - name: Cross-compile Turkish K2 binary
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src \
            -v /tmp/.ccache-k2:/root/.cache/ccache \
            -e CCACHE_DIR=/root/.cache/ccache \
            -w /src \
            helixscreen/toolchain-k2 \
            make PLATFORM_TARGET=k2 HELIX_PACKAGING=1 SKIP_OPTIONAL_DEPS=1 -j"$(nproc)"

      - name: Verify artifact
        run: |
          sudo chown -R "$(id -u):$(id -g)" build/
          test -x build/k2/bin/helix-screen
          file build/k2/bin/helix-screen
          sha256sum build/k2/bin/helix-screen

      - name: Upload K2 binary
        uses: actions/upload-artifact@v7
        with:
          name: helixscreen-k2-turkish-${{ github.sha }}
          path: |
            build/k2/bin/helix-screen
            build/k2/bin/helix-screen.sym
            build/k2/bin/helix-screen.debug
          if-no-files-found: error
          retention-days: 7
